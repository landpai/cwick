<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>音乐台 · cwick app</title>
<link rel="stylesheet" href="/apps/music/app.css?v=instrumental-10s-v2">
</head>
<body>
<div class="app">
  <header class="head">
    <a class="back" href="/#apps" target="_top">← cwick</a>
    <div class="title">
      <h1>音乐台 <span>MUSIC3</span></h1>
      <p>文本模型写纯音乐描述 · 一键生成整曲 · 实时进度 · 在线播放与下载</p>
    </div>
    <div class="head-actions">
      <span class="pill" id="textPill">检查文本模型…</span>
      <span class="pill" id="musicPill">检查音乐模型…</span>
      <button class="btn" id="switchMusic" type="button" disabled>加载音乐模型</button>
    </div>
  </header>

  <main class="layout">
    <section class="panel studio">
      <form id="musicForm">
        <div class="group-label">第一步 · 让文本模型写纯音乐描述</div>

        <label class="field">
          <span>主题关键词 <em>可留空</em></span>
          <input id="theme" type="text" maxlength="200" placeholder="例如：雨夜咖啡馆、海边公路、太空花园；留空则完全随机">
          <small>主题只作为灵感提示，纯音乐描述由当前常驻的文本模型现场生成。</small>
        </label>

        <button class="btn idea" id="ideaBtn" type="button" disabled>换一首灵感</button>
        <p class="hint">文本模型生成英文 Structured Caption，明确无主唱、无歌词、无人声采样。生成通常需要几十秒，内容可直接修改。</p>
        <div class="file-info" id="ideaMeta" hidden></div>

        <label class="field">
          <span>歌曲名</span>
          <input id="title" type="text" maxlength="80" placeholder="生成后自动填写，可修改">
        </label>

        <label class="field">
          <span>音乐描述（Structured Caption）</span>
          <textarea id="prompt" rows="9" maxlength="4000" placeholder="点击「换一首灵感」自动生成英文结构化描述"></textarea>
          <small>英文三段式描述：Global Metadata / Vocal Details / Arrangement。Vocal Details 必须明确 Vocals: None，禁止主唱、歌词和人声采样。</small>
        </label>

        <div class="group-label">第二步 · 交给音乐模型生成纯音乐</div>
        <div class="field-row three">
          <label class="field">
            <span>时长（秒）</span>
            <input id="duration" type="number" min="10" max="240" step="1" value="60">
          </label>
          <label class="field">
            <span>生成步数</span>
            <input id="steps" type="number" min="1" max="30" step="1" value="30">
          </label>
          <label class="field">
            <span>Seed（留空随机）</span>
            <input id="seed" type="number" min="0" max="9007199254740991" step="1" placeholder="可复现">
          </label>
        </div>

        <button class="btn primary submit" id="submit" type="submit" disabled>一键生成纯音乐</button>
        <p class="notice" id="notice"></p>
      </form>
    </section>

    <section class="panel monitor">
      <div class="panel-head">
        <div>
          <h2>生成进度</h2>
          <p id="taskState" class="muted">尚未提交任务</p>
        </div>
        <span class="pill" id="phasePill">idle</span>
      </div>

      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="progressBar"></i></div>
      <div class="progress-meta"><span id="progressText">0%</span><span id="stepText" class="mono">—</span></div>

      <div class="player-box">
        <audio id="player" controls preload="metadata" hidden></audio>
        <div class="empty-player" id="emptyPlayer">
          <span class="disc"></span>
          <p>音乐生成完成后可在这里在线播放</p>
        </div>
      </div>
      <a class="btn download" id="download" hidden download>下载 WAV</a>

      <div class="section">
        <h3>阶段</h3>
        <ul class="stages" id="stages"><li class="muted">等待任务</li></ul>
      </div>

      <div class="section">
        <h3>全链路耗时</h3>
        <div class="timing" id="timing"><span class="muted">完成任务后显示各阶段毫秒数</span></div>
      </div>

      <div class="section">
        <div class="section-head"><h3>最近任务</h3><button class="link" id="clearHistory" type="button">清空</button></div>
        <ul class="history" id="history"><li class="muted">暂无历史</li></ul>
      </div>
    </section>
  </main>
</div>
<script src="/apps/music/app.js?v=instrumental-10s-v2"></script>
</body>
</html>
