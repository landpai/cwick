<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>cwick · 登录</title>
<style>
  :root {
    --bg:#0a0c10; --panel:#12161d; --panel-2:#171c24; --line:#232a35;
    --line-soft:#1b212a; --text:#e8ecf3; --muted:#8b95a6; --faint:#5d6675;
    --accent:#6f8cff; --red:#ff6f7d;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","PingFang SC","Noto Sans SC",sans-serif;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text);
    font-family:var(--sans); font-size:14px; -webkit-font-smoothing:antialiased; }
  .wrap { min-height:100vh; display:grid; place-items:center; padding:24px; }
  .card { width:min(390px,100%); background:var(--panel); border:1px solid var(--line-soft);
    border-radius:18px; padding:28px; box-shadow:0 24px 70px rgba(0,0,0,.35); }
  .brand { display:flex; align-items:center; gap:11px; margin-bottom:22px; }
  .logo { width:38px; height:38px; border-radius:11px; display:grid; place-items:center;
    font-size:22px; font-weight:700; color:#0a0c10;
    background:linear-gradient(160deg,#8aa2ff,#5b76e8); }
  .brand strong { display:block; font-size:16px; letter-spacing:.2px; }
  .brand span { display:block; color:var(--faint); font-size:11px; margin-top:2px; }
  h1 { margin:0 0 6px; font-size:20px; font-weight:650; letter-spacing:-.2px; }
  .sub { margin:0 0 20px; color:var(--muted); font-size:12px; line-height:1.7; }
  label { display:block; color:var(--muted); font-size:11.5px; margin-bottom:7px; }
  input { width:100%; background:var(--panel-2); border:1px solid var(--line);
    border-radius:10px; color:var(--text); font:inherit; font-size:14px;
    padding:11px 12px; outline:0; }
  input:focus { border-color:rgba(111,140,255,.65); box-shadow:0 0 0 3px rgba(111,140,255,.12); }
  button { width:100%; margin-top:16px; border:0; border-radius:10px; padding:11px 14px;
    background:linear-gradient(160deg,#8aa2ff,#5b76e8); color:#0a0c10;
    font:inherit; font-size:13px; font-weight:650; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .err { display:none; margin-top:12px; padding:9px 11px; border-radius:9px;
    border:1px solid rgba(255,111,125,.35); background:rgba(255,111,125,.08);
    color:#ffb3bb; font-size:11.5px; line-height:1.55; }
  .err.on { display:block; }
  .foot { margin-top:18px; padding-top:14px; border-top:1px solid var(--line-soft);
    color:var(--faint); font-size:10.5px; line-height:1.65; }
  .foot code { font-family:var(--mono); color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <form class="card" id="form" autocomplete="off">
    <div class="brand">
      <div class="logo">c</div>
      <div><strong>cwick</strong><span>本地大模型控制台</span></div>
    </div>
    <h1>登录</h1>
    <p class="sub">单用户模式。密码在 cwick 启动终端的 <code>auth:</code> 日志里输出；
       若用 <code>--password</code> 或 <code>CWICK_PASSWORD</code> 指定，则使用你设置的值。</p>
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password"
           required autofocus placeholder="输入 cwick 访问密码">
    <button id="submit" type="submit">进入 cwick</button>
    <div id="err" class="err" role="alert"></div>
    <div class="foot">
      会话使用 HttpOnly / SameSite=Strict Cookie，仅保存在内存中；
      局域网 HTTP 部署请在可信 Wi-Fi 使用，公网请放在带 TLS 的反向代理后。
    </div>
  </form>
</div>
<script>
(function () {
  var form = document.getElementById('form');
  var input = document.getElementById('password');
  var btn = document.getElementById('submit');
  var err = document.getElementById('err');
  function nextURL() {
    var q = new URLSearchParams(location.search);
    var n = q.get('next') || '/';
    /* Only same-site absolute paths; never //host or a scheme. */
    if (n.charAt(0) !== '/' || n.charAt(1) === '/') n = '/';
    return n;
  }
  function show(msg) { err.textContent = msg; err.classList.add('on'); }
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    err.classList.remove('on');
    btn.disabled = true; btn.textContent = '验证中…';
    try {
      var res = await fetch('/v1/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: input.value, next: nextURL() })
      });
      var j = {};
      try { j = await res.json(); } catch (e2) {}
      if (!res.ok) {
        show((j.error && j.error.message) || ('登录失败（HTTP ' + res.status + '）'));
        return;
      }
      location.href = (j.next && j.next.charAt(0) === '/' && j.next.charAt(1) !== '/')
        ? j.next : nextURL();
    } catch (e3) {
      show('无法连接 cwick：' + (e3 && e3.message ? e3.message : e3));
    } finally {
      btn.disabled = false; btn.textContent = '进入 cwick';
    }
  });
  input.focus();
})();
</script>
</body>
</html>
